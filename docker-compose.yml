name: opcache-manager

x-php-defaults: &php-defaults
  build:
    context: .
  working_dir: /app
  entrypoint: ["/app/docker/entrypoint.sh"]
  volumes:
    - .:/app
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"

services:
  php83:
    <<: *php-defaults
    build:
      context: .
      args:
        PHP_IMAGE: "php:8.3.37-cli@sha256:9e2a4e9b1704c05cc469fddbf9b0f0f205e2bb13efd249bbad177289ebdc5c7c"
    volumes:
      - .:/app
      - vendor-php83:/app/vendor
    command: ["vendor/bin/phpunit"]

  php84:
    <<: *php-defaults
    build:
      context: .
      args:
        PHP_IMAGE: "php:8.4.28-cli@sha256:6b13a8678b38ca38e4e3950be57b664ed8c8706131a0586111f68792aede4c58"
    volumes:
      - .:/app
      - vendor-php84:/app/vendor
    command: ["vendor/bin/phpunit"]

  php85:
    <<: *php-defaults
    build:
      context: .
      args:
        PHP_IMAGE: "php:8.5.13-cli@sha256:f324fcb4dc009ac0470a7d614cd122499dcee3ca47a9bab620fc14c0eb759ba2"
    volumes:
      - .:/app
      - vendor-php85:/app/vendor
    command: ["vendor/bin/phpunit"]

  php86:
    <<: *php-defaults
    build:
      context: .
      args:
        PHP_IMAGE: "php:8.6.0-cli@sha256:d84acf3155d907afaa5afa9b9457c5f12016b6dc7ade84659f40cdc505cc087d"
    volumes:
      - .:/app
      - vendor-php86:/app/vendor
    command: ["vendor/bin/phpunit"]

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  ci:
    <<: *php-defaults
    build:
      context: .
      args:
        PHP_IMAGE: "php:8.6.0-cli@sha256:d84acf3155d907afaa5afa9b9457c5f12016b6dc7ade84659f40cdc505cc087d"
    volumes:
      - .:/app
      - vendor-php86:/app/vendor
      - .phpunit.cache:/app/.phpunit.cache
    depends_on:
      - redis
    command:
      - sh
      - -c
      - |
        set -e
        composer audit --abandoned=fail
        vendor/bin/phpstan analyse
        vendor/bin/phpcs
        vendor/bin/phpunit

volumes:
  vendor-php83:
  vendor-php84:
  vendor-php85:
  vendor-php86:
  .phpunit.cache:
